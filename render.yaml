services:
  - type: web
    name: tennis-live
    runtime: ruby
    plan: free
    buildCommand: bundle install
    startCommand: bundle exec puma -p ${PORT:-10000} -e production config.ru
    envVars:
      - key: RACK_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: BROADCAST_PASSWORD
        sync: false
      - key: VIEWER_PASSWORD
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
